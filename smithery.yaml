# Smithery configuration for Cemig: Download de Contas
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_contas_cemig_download

name: contas_cemig_download-mcp
displayName: "Cemig: Download de Contas"
description: >
  Cemig: Download de Contas, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/contas_cemig_download-mcp
repository: https://github.com/mcp-dir/contas_cemig_download-mcp

tags:
  - contas_cemig_download
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_contas_cemig_download

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_contas_cemig_download/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
